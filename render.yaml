# Render Blueprint for Darwinbox FDE Migration Agent
# Place this file at the repository root, alongside:
# backend/, frontend/, target_api/

services:
  - type: web
    name: darwinbox-fde-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darwinbox-fde-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/free
      - key: SEMANTIC_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: TARGET_API_URL
        value: https://darwinbox-fde-target-api.onrender.com
      - key: TARGET_API_PUBLIC_URL
        value: https://darwinbox-fde-target-api.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://darwinbox-fde-frontend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: darwinbox-fde-target-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./target_api/Dockerfile
    dockerContext: ./target_api
    healthCheckPath: /health
    autoDeployTrigger: commit

  - type: web
    runtime: static
    name: darwinbox-fde-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://darwinbox-fde-backend.onrender.com/api

databases:
  - name: darwinbox-fde-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
