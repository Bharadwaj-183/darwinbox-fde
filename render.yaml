# Render Blueprint - free-tier deployment
# Repository structure:
#   backend/
#   frontend/
#   target_api/
#   render.yaml

services:
  - type: web
    name: darwinbox-fde-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: darwinbox-fde-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/free
      - key: SEMANTIC_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: TARGET_API_URL
        value: https://darwinbox-fde-target-api.onrender.com
      - key: TARGET_API_PUBLIC_URL
        value: https://darwinbox-fde-target-api.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://darwinbox-fde-frontend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: darwinbox-fde-target-api
    runtime: python
    region: singapore
    plan: free
    rootDir: target_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    runtime: static
    name: darwinbox-fde-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://darwinbox-fde-backend.onrender.com/api

databases:
  - name: darwinbox-fde-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
